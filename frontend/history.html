<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History — InvoiceMatch AI OS</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="brand">InvoiceMatch <span>AI OS</span></div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="new.html">New Comparison</a>
      <a href="history.html" class="active">History</a>
      <a href="evaluation.html">Evaluation</a>
    </nav>
  </header>
  <main>
    <h1 class="page-title">History</h1>
    <p class="page-sub">Previous comparisons. Click a row to open it.</p>
    <div class="card">
      <div class="filter-bar">
        <select id="resultFilter">
          <option value="">Result: all</option>
          <option value="MATCH">MATCH</option>
          <option value="EXCEPTION">EXCEPTION</option>
          <option value="INVALID DOCUMENT">INVALID</option>
        </select>
        <select id="reviewFilter">
          <option value="">Review: all</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="none">None n/a</option>
        </select>
      </div>
      <div id="table"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
